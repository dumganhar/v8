name: Build V8 standalone

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_ARCH}" in
            ARM64) gn_arch=arm64 ;;
            X64) gn_arch=amd64 ;;
            *) echo "Unsupported runner architecture: ${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          curl -fsSL "https://chrome-infra-packages.appspot.com/dl/gn/gn/mac-${gn_arch}/+/latest" -o gn.zip
          mkdir -p buildtools/mac
          unzip -q gn.zip -d buildtools/mac
          brew install ninja
      - name: Build
        env:
          GN: buildtools/mac/gn
        run: ./build-mac.sh "${{ matrix.arch }}"
      - name: Collect artifacts
        run: |
          mkdir -p dist/include
          cp out/mac/d8 out/mac/obj/libv8_monolith.a dist/
          cp -R include/. dist/include/
      - uses: actions/upload-artifact@v4
        with:
          name: v8-macos-${{ matrix.arch }}
          path: dist

  ios:
    name: iOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64, simulator-arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_ARCH}" in
            ARM64) gn_arch=arm64 ;;
            X64) gn_arch=amd64 ;;
            *) echo "Unsupported runner architecture: ${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          curl -fsSL "https://chrome-infra-packages.appspot.com/dl/gn/gn/mac-${gn_arch}/+/latest" -o gn.zip
          mkdir -p buildtools/mac
          unzip -q gn.zip -d buildtools/mac
          brew install ninja
      - name: Build
        env:
          GN: buildtools/mac/gn
        shell: bash
        run: |
          if [[ "${{ matrix.arch }}" == simulator-arm64 ]]; then
            ./build-ios.sh arm64 simulator
          else
            ./build-ios.sh "${{ matrix.arch }}"
          fi
      - name: Collect artifacts
        run: |
          mkdir -p dist/include
          cp out/ios/obj/d8 out/ios/obj/libv8_monolith.a dist/
          cp -R include/. dist/include/
      - uses: actions/upload-artifact@v4
        with:
          name: v8-ios-${{ matrix.arch }}
          path: dist

  android:
    name: Android (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, arm, x64, x86]
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          add-to-path: false
          local-cache: false
      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/latest" -o gn.zip
          mkdir -p buildtools/linux64
          unzip -q gn.zip -d buildtools/linux64
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - name: Install Linux sysroot
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}" in
            arm64|x64) sysroot_arch=amd64 ;;
            arm|x86) sysroot_arch=i386 ;;
            *) echo "Unsupported architecture: ${{ matrix.arch }}" >&2; exit 1 ;;
          esac
          python3 build/linux/sysroot_scripts/install-sysroot.py \
            --arch="${sysroot_arch}"
      - name: Cache Chromium Clang
        uses: actions/cache@v4
        with:
          path: third_party/llvm-build
          key: chromium-clang-${{ runner.os }}-${{ hashFiles('tools/clang/scripts/update.py') }}
      - name: Install Chromium Clang
        shell: bash
        run: python3 tools/clang/scripts/update.py
      - name: Build
        env:
          GN: buildtools/linux64/gn
          NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: ./build-android.sh "${{ matrix.arch }}"
      - name: Collect artifacts
        run: |
          mkdir -p dist/include
          cp out/android/d8 out/android/obj/libv8_monolith.a dist/
          cp -R include/. dist/include/
      - uses: actions/upload-artifact@v4
        with:
          name: v8-android-${{ matrix.arch }}
          path: dist
